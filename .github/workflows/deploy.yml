name: Deploy Absen Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-absen-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 45m
          script: |
            set -e

            REPO_DIR=/home/ppg/absen-kmm-next

            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "==> Cloning repository"
              git clone https://github.com/SamudraWijayas/absen-kmm-next.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"

            echo "==> Updating repository"
            git fetch origin
            git reset --hard origin/main

            echo "==> Current commit"
            git log -1 --oneline

            echo "==> Removing existing container if present"
            docker rm -f m2bl-app 2>/dev/null || true

            echo "==> Building absen frontend image"
            docker compose build --no-cache

            echo "==> Deploying absen frontend"
            docker compose up -d

            echo "==> Waiting for container health"
            for i in {1..20}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' m2bl-app 2>/dev/null || echo "missing")
              echo "Absen health: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "==> Absen frontend is healthy"
                break
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "==> Absen frontend became unhealthy"
                docker logs --tail=50 m2bl-app
                exit 1
              fi
              sleep 5
            done

            STATUS=$(docker inspect --format='{{.State.Health.Status}}' m2bl-app 2>/dev/null || echo "missing")
            if [ "$STATUS" != "healthy" ]; then
              echo "==> Absen frontend failed health check"
              docker logs --tail=50 m2bl-app
              exit 1
            fi

            echo "==> Testing frontend"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/)
            echo "Absen frontend HTTP: $HTTP_STATUS"

            echo "==> Deployment completed successfully"
            docker compose ps
