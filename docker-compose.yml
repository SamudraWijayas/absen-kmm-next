services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: m2bl-app
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_API_URL=https://api.ppgbdl.com/api
      - NEXT_PUBLIC_IMAGE=https://api.ppgbdl.com
      - NEXTAUTH_SECRET=I44s8c044eZOnOFYRgkpONfxgbEtu5iuObu0h4JzlmA=
      - NEXTAUTH_URL=https://kmm.ppgbdl.com
      - NODE_ENV=production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - backend-network

networks:
  backend-network:
    external: true
    name: backend-kmm-new_backend-network
